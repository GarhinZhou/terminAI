<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
  #terminal { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
(function () {
  var term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    fontFamily: 'monospace',
    scrollback: 10000,
    allowProposedApi: true,
    theme: {
      background: '#101012',
      foreground: '#E2E2E2'
    }
  });
  var fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));
  fitAddon.fit();

  // Replaying raw PTY history can contain terminal capability/color queries.
  // xterm answers those queries through onData; forwarding the answers to a
  // shell would make them appear as typed garbage. Suppress only replay-side
  // answers and hold live PTY writes until parsing the replay has completed.
  var replayingHistory = false;
  var replayGeneration = 0;
  var replayPendingWrites = 0;
  var replayEndRequested = false;
  var writesAfterReplay = [];
  var outputPort = null;

  function isReplayGeneratedResponse(data) {
    if (!data || data.charAt(0) !== '\x1b') return false;
    return data.indexOf('rgb:') >= 0 || data.indexOf('$y') >= 0 ||
      /^\x1b\[(\?|>)[0-9;]*c$/.test(data) ||
      /^\x1b\[\??[0-9;]*R$/.test(data) ||
      /^\x1b\[[0-9;]*n$/.test(data) ||
      /^\x1bP[01][+$]r/.test(data);
  }

  function acknowledgePortWrite(token) {
    if (outputPort) {
      try { outputPort.postMessage('A' + token); } catch (e) {}
    }
  }

  function writeQueuedItem(item) {
    if (!item || !item.data) {
      if (item && item.acknowledgement) acknowledgePortWrite(item.acknowledgement);
      return;
    }
    if (item.acknowledgement) {
      term.write(item.data, function () { acknowledgePortWrite(item.acknowledgement); });
    } else {
      term.write(item.data);
    }
  }

  function writeAfterReplay(data, acknowledgement) {
    if (!data) return;
    if (replayingHistory) {
      writesAfterReplay.push({ data: data, acknowledgement: acknowledgement || '' });
      return;
    }
    writeQueuedItem({ data: data, acknowledgement: acknowledgement || '' });
  }

  function finishHistoryReplay(generation) {
    if (generation !== replayGeneration || !replayEndRequested || replayPendingWrites > 0) return;
    replayingHistory = false;
    replayEndRequested = false;
    var queued = writesAfterReplay;
    writesAfterReplay = [];
    for (var i = 0; i < queued.length; i++) {
      writeQueuedItem(queued[i]);
    }
    if (outputPort) {
      try { outputPort.postMessage('H'); } catch (e) {}
    }
  }

  function beginHistoryReplay() {
    replayGeneration++;
    replayingHistory = true;
    replayPendingWrites = 0;
    replayEndRequested = false;
    writesAfterReplay = [];
    term.reset();
  }

  function writeHistoryReplayChunk(data) {
    if (!replayingHistory || !data) return;
    var generation = replayGeneration;
    replayPendingWrites++;
    try {
      term.write(data, function () {
        if (generation !== replayGeneration) return;
        replayPendingWrites--;
        finishHistoryReplay(generation);
      });
    } catch (e) {
      if (generation === replayGeneration) {
        replayPendingWrites--;
        finishHistoryReplay(generation);
      }
    }
  }

  function endHistoryReplay() {
    if (!replayingHistory) return;
    replayEndRequested = true;
    finishHistoryReplay(replayGeneration);
  }

  // PTY output is a continuous stream, so use a transferred MessagePort
  // instead of evaluating one JavaScript source string for every output burst.
  window.addEventListener('message', function (event) {
    if (event.data !== '__terminai_output_port__' || !event.ports || !event.ports[0]) return;
    outputPort = event.ports[0];
    outputPort.onmessage = function (messageEvent) {
      var message = messageEvent.data;
      if (typeof message !== 'string' || message.length === 0) return;
      var kind = message.charAt(0);
      var payload = message.substring(1);
      if (kind === 'D') {
        var separator = payload.indexOf('\n');
        if (separator > 0) {
          writeAfterReplay(payload.substring(separator + 1), payload.substring(0, separator));
        }
      } else if (kind === 'B') {
        beginHistoryReplay();
      } else if (kind === 'R') {
        writeHistoryReplayChunk(payload);
      } else if (kind === 'E') {
        endHistoryReplay();
      }
    };
    outputPort.onmessageerror = function () {
      console.error('terminAI terminal output port message error');
    };
    try { outputPort.postMessage('P'); } catch (e) {}
  });

  // Notify ArkTS about user input and size changes.
  term.onData(function (data) {
    if (replayingHistory && isReplayGeneratedResponse(data)) return;
    if (window.ohosBridge) window.ohosBridge.onTermInput(data);
  });
  term.onResize(function (size) {
    if (window.ohosBridge) window.ohosBridge.onTermResize(size.cols, size.rows);
  });
  if (term.onTitleChange) {
    term.onTitleChange(function (title) {
      if (window.ohosBridge && title) {
        window.ohosBridge.onTermTitle(title);
      }
    });
  }

  // Rendered-screen signal for the activity detector. It is deliberately
  // debounced and limited to the visible tail so animated ANSI frames do not
  // flood the ArkTS bridge.
  var snapshotTimer = 0;
  term.onWriteParsed(function () {
    if (snapshotTimer) clearTimeout(snapshotTimer);
    snapshotTimer = setTimeout(function () {
      try {
        var buffer = term.buffer.active;
        var end = buffer.baseY + buffer.cursorY;
        var start = Math.max(0, end - 10);
        var lines = [];
        for (var row = start; row <= end; row++) {
          var line = buffer.getLine(row);
          if (line) lines.push(line.translateToString(true));
        }
        if (window.ohosBridge) window.ohosBridge.onTermSnapshot(lines.join('\n'));
      } catch (e) {}
    }, 220);
  });

  // Refit when the container size changes (window drag, sidebar toggle).
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      try { fitAddon.fit(); } catch (e) {}
    }).observe(document.getElementById('terminal'));
  }

  // API for ArkTS -> terminal
  window.termWrite = function (data) { writeAfterReplay(data, ''); };
  window.termReplay = function (data) {
    try {
      beginHistoryReplay();
      writeHistoryReplayChunk(data);
      endHistoryReplay();
    } catch (e) {
      replayEndRequested = true;
      replayPendingWrites = 0;
      finishHistoryReplay(replayGeneration);
    }
  };
  // Terminal color scheme presets ("default" follows dark/light app theme).
  var SCHEMES = {
    solarized: {
      background: '#002b36', foreground: '#839496', cursor: '#93a1a1',
      black: '#073642', red: '#dc322f', green: '#859900', yellow: '#b58900',
      blue: '#268bd2', magenta: '#d33682', cyan: '#2aa198', white: '#eee8d5'
    },
    dracula: {
      background: '#282a36', foreground: '#f8f8f2', cursor: '#f8f8f0',
      black: '#000000', red: '#ff5555', green: '#50fa7b', yellow: '#f1fa8c',
      blue: '#bd93f9', magenta: '#ff79c6', cyan: '#8be9fd', white: '#bfbfbf'
    },
    gruvbox: {
      background: '#282828', foreground: '#ebdbb2', cursor: '#ebdbb2',
      black: '#282828', red: '#cc241d', green: '#98971a', yellow: '#d79921',
      blue: '#458588', magenta: '#b16286', cyan: '#689d6a', white: '#a89984'
    },
    lightpaper: {
      background: '#ffffff', foreground: '#333333', cursor: '#333333',
      black: '#333333', red: '#c5221f', green: '#2e7d32', yellow: '#b26a00',
      blue: '#1a73e8', magenta: '#ad1457', cyan: '#00838f', white: '#888888'
    }
  };
  // Apply runtime style: size, bold, dark(app theme), font, cursor, scheme.
  // "default" scheme follows the app theme (dark/light); presets override.
  window.termSetStyle = function (size, bold, dark, font, cursor, scheme, lineHeight) {
    try {
      term.options.fontSize = size;
      term.options.fontWeight = bold ? 'bold' : 'normal';
      // An empty value means "system monospace". Always assign it so switching
      // back from a named font does not leave xterm.js on the previous family.
      term.options.fontFamily = font || 'monospace';
      if (lineHeight) term.options.lineHeight = lineHeight;
      if (cursor) term.options.cursorStyle = cursor;
      var sc = (scheme && SCHEMES[scheme]) ? SCHEMES[scheme]
        : (dark ? { background: '#101012', foreground: '#E2E2E2' }
                : { background: '#ffffff', foreground: '#333333' });
      term.options.theme = sc;
      document.documentElement.style.background = sc.background;
      document.body.style.background = sc.background;
      fitAddon.fit();
    } catch (e) {}
  };
  window.termSetScrollback = function (lines) {
    try { term.options.scrollback = lines; } catch (e) {}
  };
  window.termFitNow = function () {
    try { fitAddon.fit(); return term.cols + ',' + term.rows; } catch (e) { return ''; }
  };
  window.termClear = function () { term.clear(); };
  window.termFocus = function () { term.focus(); };
  window.termPaste = function (data) { if (data) term.paste(data); };
  window.getTermSize = function () { return term.cols + ',' + term.rows; };

  // ── Selection / clipboard ──
  function fallbackCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) {}
  }

  function copySelection() {
    var sel = term.getSelection();
    if (!sel) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(sel).catch(function () { fallbackCopy(sel); });
    } else {
      fallbackCopy(sel);
    }
    term.focus();
  }

  function pasteClipboard() {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) {
        if (t) term.paste(t);
      }).catch(function () {});
    }
  }

  // Keyboard: Ctrl+C copies only when there is a selection (otherwise the PTY
  // receives SIGINT); Ctrl+V / Ctrl+Shift+V paste; Ctrl+Shift+A select all.
  term.attachCustomKeyEventHandler(function (e) {
    if (e.type !== 'keydown') return true;
    var ctrl = e.ctrlKey, shift = e.shiftKey, alt = e.altKey, meta = e.metaKey;
    if (ctrl && !shift && !alt && !meta && e.key.toUpperCase() === 'C') {
      if (term.hasSelection()) { copySelection(); return false; }
      return true;
    }
    if (ctrl && !shift && !alt && !meta && e.key.toUpperCase() === 'V') {
      // Skip xterm's Ctrl+V control-character translation, but leave the
      // browser default intact so its native paste event inserts text once.
      return false;
    }
    if (ctrl && shift && !alt && !meta && e.key.toUpperCase() === 'C') {
      copySelection(); return false;
    }
    if (ctrl && shift && !alt && !meta && e.key.toUpperCase() === 'V') {
      return false;
    }
    if (ctrl && shift && !alt && !meta && e.key.toUpperCase() === 'A') {
      term.selectAll(); return false;
    }
    return true;
  });

  // Right-click is handled by the ArkUI native context menu; expose the
  // clipboard/selection actions it invokes.
  window.termCopySelection = copySelection;
  window.termPasteClipboard = pasteClipboard;
  window.termSelectAll = function () { term.selectAll(); };
  // Chromium maps Ctrl+wheel to page zoom. Terminal font size is controlled
  // only from terminAI settings, so consume that gesture without changing the
  // normal terminal scrollback behavior.
  document.addEventListener('wheel', function (event) {
    if (!event.ctrlKey) return;
    event.preventDefault();
    event.stopPropagation();
  }, { passive: false, capture: true });

  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
